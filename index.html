<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#101820">
  <title>Rail Sim — 3D試作</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game"></div>

  <section id="menu" class="panel">
    <h1>Rail Sim <small>3D 試作</small></h1>
    <p class="note">ゲーム向けの架空シミュレーションです。演出は視覚表現のみです。</p>

    <label>操作モード
      <select id="platformSelect"><option value="pc">PC</option><option value="mobile">スマートフォン</option></select>
    </label>
    <label>視点
      <select id="viewSelect"><option value="chase">3D追従</option><option value="top">真上から</option></select>
    </label>
    <label>シナリオ
      <select id="scenarioSelect">
        <option value="station">駅構内</option>
        <option value="siding">留置線</option>
        <option value="reverse">逆走コース</option>
      </select>
    </label>
    <label>グラフィック
      <select id="qualitySelect"><option value="balanced">標準</option><option value="high">高品質</option><option value="performance">軽量</option></select>
    </label>
    <button id="startButton" class="primary">ゲーム開始</button>
    <p class="help">PC：W / ↑ 加速、S / ↓ 減速、Space ブレーキ。スマホ：画面下のボタン。</p>
  </section>

  <aside id="hud" class="panel hidden">
    <div><strong id="scenarioLabel">駅構内</strong><span id="speedLabel">0 km/h</span></div>
    <div class="meter"><span id="damageBar"></span></div>
    <div class="hud-bottom"><span>損傷 <b id="damageLabel">0%</b></span><button id="viewButton">視点切替</button><button id="menuButton">設定</button></div>
  </aside>

  <div id="mobileControls" class="hidden">
    <button data-control="brake">ブレーキ</button>
    <button data-control="reverse">減速／後進</button>
    <button data-control="throttle" class="primary">加速</button>
  </div>
  <div id="message" class="hidden"></div>

  <script type="module" src="game.js"></script>
</body>
</html>
